<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Account — WEDORA</title><link rel="stylesheet" href="css/app.css"></head>
<body><a class="auth-back" href="index.html">← WEDORA</a><main class="auth-layout"><section class="auth-visual"></section><section class="auth-panel"><div class="auth-card">
<a class="logo" href="index.html">WED<em>O</em>RA</a><div style="margin-top:44px"><span class="kicker" data-i18n="auth_kicker"></span><h1 id="authTitle" data-i18n="auth_title_login"></h1><p data-i18n="auth_desc"></p></div>
<form id="authForm" style="margin-top:25px"><div id="signupFields" hidden><div class="field"><label data-i18n="auth_full_name"></label><input name="full_name" autocomplete="name"></div><div class="field"><label data-i18n="auth_phone"></label><input name="phone" autocomplete="tel"></div></div>
<div class="field"><label data-i18n="auth_email"></label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label data-i18n="auth_password"></label><input name="password" type="password" minlength="6" required></div><div id="authMessage"></div><button class="btn btn-wine" id="authSubmit" style="width:100%" data-i18n="auth_login"></button></form>
<button class="btn btn-outline auth-switch" id="authSwitch" data-i18n="auth_switch_signup"></button><div style="display:flex;justify-content:center;margin-top:15px"><button class="mini-btn" data-lang-toggle>EN</button></div>
</div></section></main><script type="module" src="js/auth.js"></script></body></html>

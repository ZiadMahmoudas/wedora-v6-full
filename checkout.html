<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — WEDORA</title><link rel="stylesheet" href="css/app.css"></head><body class="app-body"><header class="app-topbar"><div class="app-topbar-inner"><a class="logo" href="index.html">WED<em>O</em>RA</a><div class="app-user-actions"><button class="mini-btn" data-lang-toggle>EN</button><a class="mini-btn" href="dashboard.html">← <span data-i18n="dashboard_title"></span></a></div></div></header><main class="checkout-layout"><section class="checkout-copy"><span class="kicker" data-i18n="checkout_kicker"></span><h1 data-i18n="checkout_title"></h1><p><span data-lang-only="ar">حوّل قيمة الباقة يدويًا، ارفع الإيصال، والإدارة تراجع الطلب قبل تشغيل رابط الدعوة للعامة.</span><span data-lang-only="en">Transfer the plan amount, upload the receipt, and admin reviews the order before your public invitation link is activated.</span></p><div class="compare-box" style="margin-top:30px"><div class="compare-side"><small data-lang-only="ar">الدعوة</small><small data-lang-only="en">Invitation</small><strong id="checkoutInvite">—</strong></div><div class="compare-side"><small data-lang-only="ar">الحالة بعد الإرسال</small><small data-lang-only="en">Status after submission</small><strong>Pending Review</strong></div></div></section><section class="checkout-card"><div id="orderSuccess" hidden></div><form id="checkoutForm"><div class="checkout-plan" id="checkoutPlan"></div><div class="field"><label data-i18n="checkout_method"></label><select id="paymentMethod"><option value="vodafone_cash">Vodafone Cash</option><option value="instapay">InstaPay</option></select></div><div class="payment-box"><small data-i18n="checkout_transfer_to"></small><strong id="paymentDestination"></strong><button type="button" class="mini-btn" id="copyPay" style="margin-top:8px">Copy</button></div><div class="field"><label data-i18n="checkout_reference"></label><input id="transferReference" placeholder="839271"></div><div class="field"><label data-i18n="checkout_receipt"></label><label class="upload-zone"><span data-lang-only="ar">ارفع Screenshot أو PDF</span><span data-lang-only="en">Upload screenshot or PDF</span><input id="receiptFile" type="file" accept="image/*,application/pdf" hidden required></label><small id="receiptName"></small></div><button class="btn btn-wine" id="paySubmit" style="width:100%" data-i18n="checkout_send"></button><div id="checkoutMsg"></div></form></section></main><script type="module" src="js/checkout.js"></script></body></html>

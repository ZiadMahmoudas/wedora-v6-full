<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pricing — WEDORA</title><link rel="stylesheet" href="css/app.css"></head>
<body>
<div data-site-header></div>
<main>
<section class="page-hero">
  <div class="container">
    <span class="kicker" data-i18n="pricing_kicker"></span>
    <h1 data-i18n="pricing_title"></h1>
    <p data-i18n="pricing_desc"></p>
    <div class="pricing-hero-note">✦ <span data-i18n="pricing_trial"></span> · <span data-i18n="pricing_trial_desc"></span></div>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="plan-grid" id="pricingPlans"></div>
    <div class="compare-box">
      <div class="compare-side">
        <h3 data-i18n="home_compare_print"></h3>
        <strong data-i18n="pricing_print_cost"></strong>
        <p data-i18n="home_compare_print_desc"></p>
      </div>
      <div class="compare-side">
        <h3 data-i18n="home_compare_digital"></h3>
        <strong data-i18n="pricing_one_link"></strong>
        <p data-i18n="home_compare_digital_desc"></p>
      </div>
    </div>
  </div>
</section>
<section class="section section-soft">
 <div class="container">
   <div class="faq-list">
     <article class="faq-item"><button class="faq-question"><span data-i18n="pricing_how_pay"></span><span>+</span></button><div class="faq-answer"><div><p data-i18n="pricing_how_pay_a"></p></div></div></article>
     <article class="faq-item"><button class="faq-question"><span data-i18n="pricing_edit"></span><span>+</span></button><div class="faq-answer"><div><p data-i18n="pricing_edit_a"></p></div></div></article>
     <article class="faq-item"><button class="faq-question"><span data-i18n="pricing_subscription"></span><span>+</span></button><div class="faq-answer"><div><p data-i18n="pricing_subscription_a"></p></div></div></article>
   </div>
 </div>
</section>
</main>
<div data-site-footer></div>
<script type="module" src="js/common.js"></script><script type="module" src="js/pricing.js"></script>
</body></html>

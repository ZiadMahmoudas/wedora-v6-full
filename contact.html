<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — WEDORA</title><link rel="stylesheet" href="css/app.css"></head>
<body>
<div data-site-header></div>
<main>
<section class="page-hero"><div class="container"><span class="kicker" data-i18n="contact_kicker"></span><h1 data-i18n="contact_title"></h1><p data-i18n="contact_desc"></p></div></section>
<section class="section"><div class="container contact-grid">
  <aside class="contact-card">
    <div class="contact-item"><small>WhatsApp</small><strong id="contactWhatsapp">—</strong></div>
    <div class="contact-item"><small>Email</small><strong id="contactEmail">—</strong></div>
    <div class="contact-item"><small>Instagram</small><a id="contactInstagram" href="#" target="_blank">—</a></div>
    <div class="contact-item"><small>Messenger</small><a id="contactMessenger" href="#" target="_blank">—</a></div>
  </aside>
  <form class="form-card" id="contactForm">
    <div class="form-grid">
      <div class="field"><label data-i18n="contact_name"></label><input name="name" required></div>
      <div class="field"><label data-i18n="contact_email"></label><input name="email" type="email"></div>
      <div class="field"><label data-i18n="contact_phone"></label><input name="phone" inputmode="tel"></div>
      <div class="field full"><label data-i18n="contact_message"></label><textarea name="message" rows="6" required></textarea></div>
    </div>
    <div class="message" id="contactStatus"></div>
    <button class="btn btn-wine" data-i18n="contact_send"></button>
  </form>
</div></section>
</main>
<div data-site-footer></div>
<script type="module" src="js/common.js"></script><script type="module" src="js/contact.js"></script>
</body></html>
